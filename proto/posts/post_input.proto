syntax = "proto3";
package posts;

option go_package = "pb/posts;posts";

import "posts/post_message.proto";

message CreatePostRequest {
    string subject_class_id = 2;
    string topic_subject_id = 3;
    PostType type = 4;
    string type_id = 5;
    string title = 6;
    string description = 7;
    string file_type = 8;
    string storage_id = 9;
    string source = 10;
    bool is_allow_to_comment = 11;
    bool is_published = 12;
}

message UpdatePostRequest {
    string id = 1;
    string subject_class_id = 2;
    string topic_subject_id = 3;
    string type_id = 5;
    string title = 6;
    string description = 7;
    string file_type = 8;
    string storage_id = 9;
    string source = 10;
    bool is_allow_to_comment = 11;
    bool is_published = 12;
}

message CreateCommentRequest {
    string post_id = 1;
    string student_id = 2;
    string student_name = 3;
    string comment = 4;
}
